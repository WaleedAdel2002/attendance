<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>منظومة رصد أعمال السنة ومصفوفة الحضور</title>
  <style>
    :root {
      --primary: #0284c7;
      --navy: #0f172a;
      --success: #16a34a;
      --border: #cbd5e1;
      --bg: #f8fafc;
    }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: #1e293b;
      margin: 0;
      padding: 20px;
    }
    .container { max-width: 1400px; margin: auto; }
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 15px;
    }
    .card {
      background: #fff;
      border-radius: 14px;
      padding: 22px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 4px 15px rgba(0,0,0,0.03);
      margin-bottom: 20px;
    }
    .controls-grid {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr auto;
      gap: 12px;
      align-items: end;
    }
    @media (max-width: 800px) { .controls-grid { grid-template-columns: 1fr; } }
    label { font-size: 13px; font-weight: bold; color: #475569; display: block; margin-bottom: 6px; }
    input, select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      box-sizing: border-box;
      outline: none;
    }
    .btn {
      padding: 10px 18px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      color: #fff;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
    }
    .btn-primary { background: var(--primary); }
    .btn-success { background: var(--success); }
    .btn-navy { background: var(--navy); }
    
    .table-container {
      overflow-x: auto;
      max-height: 560px;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      margin-top: 15px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      text-align: center;
      font-size: 13px;
      background: #fff;
    }
    th, td {
      padding: 10px 8px;
      border: 1px solid #e2e8f0;
      white-space: nowrap;
    }
    th {
      background: #f1f5f9;
      color: var(--navy);
      position: sticky;
      top: 0;
      z-index: 5;
    }
    .check-yes { color: #16a34a; font-weight: bold; font-size: 16px; }
    .check-no { color: #cbd5e1; font-size: 14px; }
    .grade-input {
      width: 65px;
      text-align: center;
      padding: 6px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-weight: bold;
    }
    .total-badge {
      background: #e0f2fe;
      color: #0369a1;
      font-weight: bold;
      padding: 5px 10px;
      border-radius: 6px;
      display: inline-block;
    }

    /* ستايل زر التبديل لنشر أو إخفاء الدرجات */
    .switch-container {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #f8fafc;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      margin-top: 15px;
      width: fit-content;
    }
    .switch {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 24px;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #cbd5e1;
      transition: .3s;
      border-radius: 24px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }
    input:checked + .slider {
      background-color: var(--success);
    }
    input:checked + .slider:before {
      transform: translateX(20px);
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header-bar">
      <div>
        <h2 style="margin:0 0 5px; color:var(--navy);">منظومة رصد أعمال السنة ومصفوفة الحضور</h2>
        <span style="font-size:13px; color:#64748b;" id="profTag">المحاضر: جاري التحقق...</span>
      </div>
      <div style="display:flex; gap:10px;">
        <button class="btn btn-success" id="saveBtn" onclick="saveGradesToCloud()">
          💾 حفظ التعديلات في الشيت
        </button>
        <button class="btn btn-navy" onclick="exportMatrixCSV()">
          📊 تصدير Excel للمنصة
        </button>
        <a href="index.html" class="btn" style="background:#64748b; text-decoration:none;">الرئيسية</a>
      </div>
    </div>

    <div class="card">
      <div class="controls-grid">
        <div>
          <label>اختر المقرر الأساسي</label>
          <select id="baseCourseSelect" onchange="onCourseChanged()"></select>
        </div>
        <div>
          <label>درجة الحضور</label>
          <input type="number" id="maxAttendanceScore" value="10" min="0" max="100" oninput="recalculateTotals()">
        </div>
        <div>
          <label>فلترة المجموعة (اختياري)</label>
          <input type="text" id="groupFilter" placeholder="الكل" oninput="renderMatrixTable()">
        </div>
        <button class="btn btn-primary" onclick="loadData()">تحديث البيانات</button>
      </div>

      <!-- زر التحكم في إظهار أو حجب الدرجات في البوابة للطلاب -->
      <div class="switch-container">
        <label class="switch">
          <input type="checkbox" id="toggleGradesVis" onchange="updateCourseVisibility(this.checked)">
          <span class="slider"></span>
        </label>
        <label for="toggleGradesVis" style="margin:0; font-size:13px; font-weight:bold; color:var(--navy); cursor:pointer;">
          إتاحة إظهار درجات أعمال السنة للطلاب في البوابة لهذا المقرر
        </label>
        <span id="visStatusLabel" style="font-size:12px; color:#64748b;">(مخفية حالياً: يظهر الحضور فقط)</span>
      </div>
    </div>

    <div class="card" style="padding:15px;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
        <span style="font-weight:bold; font-size:14px;" id="matrixCount">عدد الطلاب: 0</span>
        <span style="font-size:12px; color:#64748b;">المعرف الأساسي للطالب هو (كود الطالب) مع عزل المقررات بالسحابة</span>
      </div>

      <div class="table-container">
        <table id="matrixTable">
          <thead id="matrixHead">
            <tr><th>م</th><th>كود الطالب</th><th>اسم الطالب</th><th>الفرقة</th><th>المجموعة</th></tr>
          </thead>
          <tbody id="matrixBody">
            <tr><td colspan="9" style="padding:25px; color:#94a3b8;">جاري استخراج مصفوفة الحضور...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxSOBgR0KLCgDLBZYsiFcmG1EXMIMJE-ZEtOidFNTSS3FIZRvlGpIycZd_leld5MU-k/exec";
    let activeUser = JSON.parse(localStorage.getItem("auth_user") || sessionStorage.getItem("auth_user") || "null");

    let allRawRecords = [];
    let savedGradesMap = {};
    let courseGroups = {};
    let visibilityMap = {};

    window.onload = function() {
      if (activeUser) {
        document.getElementById("profTag").innerText = `المحاضر: ${activeUser.name} (${activeUser.email})`;
        savedGradesMap = JSON.parse(localStorage.getItem("grades_cache_code_" + activeUser.email) || "{}");
        loadData();
      } else {
        alert("يرجى تسجيل الدخول أولاً من الصفحة الرئيسية");
        window.location.href = "index.html";
      }
    };

    function parseCourseName(raw) {
      if (!raw) return { base: "عام", session: "1" };
      let str = raw.trim();
      const match = str.match(/^(.*?)[_\s-]*([0-9\u0660-\u0669]+)$/);
      if (match) {
        let base = match[1].replace(/محاضرة|سكشن/g, "").trim();
        return { base: base || match[1].trim(), session: match[2].trim() };
      }
      return { base: str, session: "1" };
    }

    function loadData() {
      if (!activeUser) return;

      const p1 = fetch(`${SCRIPT_URL}?action=getCumulative&lecturerEmail=${encodeURIComponent(activeUser.email)}&_t=${Date.now()}`)
        .then(r => r.json());

      const p2 = fetch(`${SCRIPT_URL}?action=getSavedGrades&lecturerEmail=${encodeURIComponent(activeUser.email)}&_t=${Date.now()}`)
        .then(r => r.json())
        .catch(() => ({ status: "bypass", grades: {} }));

      const p3 = fetch(`${SCRIPT_URL}?action=getVisibility&lecturerEmail=${encodeURIComponent(activeUser.email)}&_t=${Date.now()}`)
        .then(r => r.json())
        .catch(() => ({ status: "bypass", visibility: {} }));

      Promise.allSettled([p1, p2, p3]).then(results => {
        const resAttendance = results[0].status === "fulfilled" ? results[0].value : null;
        const resGrades = results[1].status === "fulfilled" ? results[1].value : null;
        const resVis = results[2].status === "fulfilled" ? results[2].value : null;

        if (resAttendance && resAttendance.status === "success" && Array.isArray(resAttendance.records)) {
          allRawRecords = resAttendance.records;
        }

        if (resGrades && resGrades.status === "success" && resGrades.grades) {
          savedGradesMap = Object.assign({}, savedGradesMap, resGrades.grades);
          localStorage.setItem("grades_cache_code_" + activeUser.email, JSON.stringify(savedGradesMap));
        }

        if (resVis && resVis.status === "success" && resVis.visibility) {
          visibilityMap = resVis.visibility;
        }

        organizeCourses();
        populateCourseDropdown();
        onCourseChanged();
      });
    }

    // تجميع الطلاب حسب (كود الطالب) كمعرف أساسي
    function organizeCourses() {
      courseGroups = {};
      allRawRecords.forEach(r => {
        const parsed = parseCourseName(r.course);
        if (!courseGroups[parsed.base]) {
          courseGroups[parsed.base] = { sessions: new Set(), students: {} };
        }
        courseGroups[parsed.base].sessions.add(parsed.session);

        // الكود هو المعرف الأساسي، وفي حال غيابه يتم استخدام الاسم كبديل مؤقت
        const stCode = (r.code || r.name || "").toString().trim();
        const currentName = (r.name || "").replace(" (يدوي)", "").trim();
        if (!stCode) return;

        const studentsObj = courseGroups[parsed.base].students;

        if (!studentsObj[stCode]) {
          studentsObj[stCode] = {
            code: stCode,
            name: currentName || stCode,
            grade: r.grade || "-",
            group: r.group || "-",
            attendedSessions: new Set()
          };
        } else {
          // في حال تسجيل الطالب باسم أطول أو أدق لاحقاً تحت نفس الكود يتم تحديث الاسم
          if (currentName && currentName.split(" ").length > studentsObj[stCode].name.split(" ").length) {
            studentsObj[stCode].name = currentName;
          }
        }
        studentsObj[stCode].attendedSessions.add(parsed.session);
      });
    }

    function populateCourseDropdown() {
      const select = document.getElementById("baseCourseSelect");
      const currentVal = select.value;
      select.innerHTML = "";
      const bases = Object.keys(courseGroups);

      if (bases.length === 0) {
        select.innerHTML = '<option value="">لا توجد مقررات مسجلة بعد في الشيت</option>';
        return;
      }

      bases.forEach(b => {
        const opt = document.createElement("option");
        opt.value = b;
        opt.innerText = `مقرر: ${b} (${courseGroups[b].sessions.size} جلسات رُصدت)`;
        select.appendChild(opt);
      });

      if (currentVal && bases.includes(currentVal)) select.value = currentVal;
    }

    function onCourseChanged() {
      renderMatrixTable();
      updateVisibilityUI();
    }

    function updateVisibilityUI() {
      const baseCourse = document.getElementById("baseCourseSelect").value;
      const isVis = visibilityMap[baseCourse] === true;
      const toggle = document.getElementById("toggleGradesVis");
      const label = document.getElementById("visStatusLabel");

      toggle.checked = isVis;
      if (isVis) {
        label.innerText = "(معروضة للطلاب في البوابة)";
        label.style.color = "var(--success)";
      } else {
        label.innerText = "(مخفية حالياً: يظهر الحضور فقط)";
        label.style.color = "#64748b";
      }
    }

    function updateCourseVisibility(isChecked) {
      const baseCourse = document.getElementById("baseCourseSelect").value;
      if (!baseCourse) return;

      visibilityMap[baseCourse] = isChecked;
      updateVisibilityUI();

      fetch(SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          action: "toggleVisibility",
          lecturerEmail: activeUser.email,
          baseCourse: baseCourse,
          showGrades: isChecked
        })
      });
    }

    function renderMatrixTable() {
      const baseCourse = document.getElementById("baseCourseSelect").value;
      const groupFilter = document.getElementById("groupFilter").value.trim();
      const maxAttScore = parseFloat(document.getElementById("maxAttendanceScore").value) || 10;
      const tbody = document.getElementById("matrixBody");

      if (!baseCourse || !courseGroups[baseCourse]) {
        tbody.innerHTML = '<tr><td colspan="11" style="padding:25px; color:#94a3b8;">لا توجد سجلات متاحة لعرضها</td></tr>';
        document.getElementById("matrixCount").innerText = "عدد الطلاب: 0";
        return;
      }

      const sessions = Array.from(courseGroups[baseCourse].sessions).sort((a,b) => (parseInt(a) || 0) - (parseInt(b) || 0));
      const totalSessions = sessions.length;
      const studentsObj = courseGroups[baseCourse].students;

      // عمود كود الطالب بجانب اسم الطالب
      let headHTML = `<tr>
        <th>م</th>
        <th>كود الطالب</th>
        <th>اسم الطالب</th>
        <th>الفرقة</th>
        <th>المجموعة</th>`;
      
      sessions.forEach(s => { headHTML += `<th>جلسة (${s})</th>`; });
      headHTML += `
        <th>الحضور (${totalSessions})</th>
        <th>درجة الحضور (${maxAttScore})</th>
        <th>العملي</th>
        <th>الميدترم</th>
        <th>إجمالي أعمال السنة</th>
      </tr>`;
      document.getElementById("matrixHead").innerHTML = headHTML;

      tbody.innerHTML = "";
      let count = 0;

      Object.keys(studentsObj).sort((a,b) => a.localeCompare(b, undefined, {numeric: true})).forEach(code => {
        const info = studentsObj[code];
        if (groupFilter && info.group.toString().trim() !== groupFilter) return;
        count++;

        const attendedCount = info.attendedSessions.size;
        const attendanceScore = totalSessions > 0 ? ((attendedCount / totalSessions) * maxAttScore).toFixed(1) : 0;

        // قراءة الدرجة عبر المفتاح المركب المعتمد على الكود
        const compositeKey = baseCourse + "___" + code;
        let saved = savedGradesMap[compositeKey] || savedGradesMap[baseCourse + "___" + info.name] || { practical: 0, midterm: 0 };

        let pVal = saved.practical !== undefined ? saved.practical : 0;
        let mVal = saved.midterm !== undefined ? saved.midterm : 0;

        let rowHTML = `<tr>
          <td>${count}</td>
          <td style="font-weight:bold; color:var(--primary);">${code}</td>
          <td style="text-align:right; font-weight:bold;">${info.name}</td>
          <td>${info.grade}</td>
          <td>${info.group}</td>`;

        sessions.forEach(s => {
          rowHTML += info.attendedSessions.has(s) ? `<td class="check-yes">✔</td>` : `<td class="check-no">✖</td>`;
        });

        rowHTML += `
          <td><strong>${attendedCount}</strong></td>
          <td id="att_score_${count}">${attendanceScore}</td>
          <td><input type="number" class="grade-input practical-in" data-code="${code}" data-name="${info.name}" value="${pVal}" oninput="updateRowTotal(this)"></td>
          <td><input type="number" class="grade-input midterm-in" data-code="${code}" data-name="${info.name}" value="${mVal}" oninput="updateRowTotal(this)"></td>
          <td><span class="total-badge row-total">0</span></td>
        </tr>`;

        tbody.innerHTML += rowHTML;
      });

      document.getElementById("matrixCount").innerText = `عدد الطلاب: ${count}`;
      recalculateTotals();
    }

    function updateRowTotal(el) {
      const row = el.closest("tr");
      const baseCourse = document.getElementById("baseCourseSelect").value;
      const attScore = parseFloat(row.querySelector('[id^="att_score_"]').innerText) || 0;
      const practical = parseFloat(row.querySelector(".practical-in").value) || 0;
      const midterm = parseFloat(row.querySelector(".midterm-in").value) || 0;
      const total = (attScore + practical + midterm).toFixed(1);
      row.querySelector(".row-total").innerText = total;

      // حفظ فوري في الكاش بمفتاح (المقرر + كود الطالب)
      const code = row.querySelector(".practical-in").getAttribute("data-code");
      const name = row.querySelector(".practical-in").getAttribute("data-name");
      const compositeKey = baseCourse + "___" + code;
      
      if (!savedGradesMap[compositeKey]) savedGradesMap[compositeKey] = {};
      savedGradesMap[compositeKey].code = code;
      savedGradesMap[compositeKey].name = name;
      savedGradesMap[compositeKey].practical = practical;
      savedGradesMap[compositeKey].midterm = midterm;
      savedGradesMap[compositeKey].totalScore = total;
      localStorage.setItem("grades_cache_code_" + activeUser.email, JSON.stringify(savedGradesMap));
    }

    function recalculateTotals() {
      document.querySelectorAll("#matrixBody tr").forEach(row => {
        const el = row.querySelector(".practical-in");
        if (el) updateRowTotal(el);
      });
    }

    function saveGradesToCloud() {
      const baseCourse = document.getElementById("baseCourseSelect").value;
      if (!baseCourse) return alert("يرجى اختيار المقرر أولاً");

      const entries = [];
      document.querySelectorAll("#matrixBody tr").forEach(row => {
        const pIn = row.querySelector(".practical-in");
        const mIn = row.querySelector(".midterm-in");
        const attEl = row.querySelector('[id^="att_score_"]');
        const totEl = row.querySelector(".row-total");

        if (pIn && mIn && attEl && totEl) {
          const stCode = pIn.getAttribute("data-code");
          const stName = pIn.getAttribute("data-name");
          const pVal = parseFloat(pIn.value) || 0;
          const mVal = parseFloat(mIn.value) || 0;
          const aVal = parseFloat(attEl.innerText) || 0;
          const tVal = parseFloat(totEl.innerText) || 0;

          entries.push({
            code: stCode,
            name: stName,
            attScore: aVal,
            practical: pVal,
            midterm: mVal,
            totalScore: tVal
          });

          const compositeKey = baseCourse + "___" + stCode;
          savedGradesMap[compositeKey] = { code: stCode, name: stName, attScore: aVal, practical: pVal, midterm: mVal, totalScore: tVal };
        }
      });

      localStorage.setItem("grades_cache_code_" + activeUser.email, JSON.stringify(savedGradesMap));

      const btn = document.getElementById("saveBtn");
      btn.innerText = "جاري الحفظ في الشيت...";
      btn.disabled = true;

      fetch(SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          action: "saveGrades",
          lecturerEmail: activeUser.email,
          baseCourse: baseCourse,
          entries: entries
        })
      }).then(() => {
        btn.innerText = "💾 حفظ التعديلات في الشيت";
        btn.disabled = false;
        alert(`تم حفظ درجات مقرر (${baseCourse}) بالكود الجامعي بنجاح!`);
      }).catch(() => {
        btn.innerText = "💾 حفظ التعديلات في الشيت";
        btn.disabled = false;
        alert("تم الحفظ محلياً، تحقق من اتصال الإنترنت لرفع الشيت");
      });
    }

    function exportMatrixCSV() {
      const baseCourse = document.getElementById("baseCourseSelect").value;
      if (!baseCourse) return alert("يرجى اختيار المقرر أولاً");

      let csv = "\uFEFFم,كود الطالب,اسم الطالب,الفرقة,المجموعة,عدد المحاضرات,درجة الحضور,درجة العملي,درجة الميدترم,إجمالي أعمال السنة\n";
      document.querySelectorAll("#matrixBody tr").forEach(row => {
        const cols = row.querySelectorAll("td");
        if (cols.length > 5) {
          const m = cols[0].innerText;
          const code = `"${cols[1].innerText}"`;
          const name = `"${cols[2].innerText}"`;
          const grade = cols[3].innerText;
          const grp = cols[4].innerText;
          const pIn = row.querySelector(".practical-in").value;
          const mIn = row.querySelector(".midterm-in").value;
          const tot = row.querySelector(".row-total").innerText;
          const attScore = row.querySelector('[id^="att_score_"]').innerText;
          const attCount = cols[cols.length - 5].innerText;

          csv += `${m},${code},${name},${grade},${grp},${attCount},${attScore},${pIn},${mIn},${tot}\n`;
        }
      });

      const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `أعمال_سنة_${baseCourse}_${new Date().toISOString().slice(0,10)}.csv`;
      a.click();
    }
  </script>
</body>
</html>
