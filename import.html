<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>استيراد كشف الطلاب من Excel</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background: #f8fafc; margin: 0; padding: 25px; color: #0f172a; }
    .container { max-width: 950px; margin: auto; }
    .card { background: #fff; border-radius: 12px; padding: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 20px; }
    .drop-zone { border: 2px dashed #94a3b8; border-radius: 10px; padding: 35px; text-align: center; cursor: pointer; background: #f1f5f9; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; text-align: center; font-size: 13px; }
    th, td { padding: 10px; border: 1px solid #e2e8f0; }
    th { background: #f8fafc; }
    .btn { padding: 10px 20px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; background: #0284c7; color: #fff; }
  </style>
</head>
<body>

  <div class="container">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
      <h2>استيراد كشف المقيدين من ملف Excel</h2>
      <a href="index.html" class="btn" style="text-decoration:none; background:#475569;">العودة للرئيسية</a>
    </div>

    <div class="card">
      <div class="drop-zone" onclick="document.getElementById('fileInp').click()">
        <p style="margin:0; font-weight:bold; color:#334155;">اضغط هنا لاختيار ملف Excel (.xlsx أو .csv)</p>
        <span style="font-size:12px; color:#64748b;">ترتيب الأعمدة المفضل: اسم الطالب - الرقم الجامعي - المجموعة - السكشن</span>
        <input type="file" id="fileInp" accept=".xlsx, .xls, .csv" style="display:none;" onchange="handleFile(this)">
      </div>
    </div>

    <div class="card" id="previewCard" style="display:none;">
      <h3>معاينة الطلاب المقيدين (<span id="totalLoaded">0</span> طالب)</h3>
      <div style="overflow-x:auto; max-height:450px;">
        <table id="previewTable">
          <thead>
            <tr>
              <th>م</th>
              <th>اسم الطالب</th>
              <th>الرقم الجامعي</th>
              <th>المجموعة</th>
              <th>السكشن</th>
            </tr>
          </thead>
          <tbody id="previewBody"></tbody>
        </table>
      </div>
      <button class="btn" style="background:#16a34a; margin-top:15px;" onclick="saveImportedStudents()">اعتماد وتثبيت الكشف</button>
    </div>
  </div>

  <script>
    let parsedStudents = [];

    function handleFile(input) {
      const file = input.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const data = new Uint8Array(e.target.result);
        const workbook = XLSX.read(data, { type: 'array' });
        const sheet = workbook.Sheets[workbook.SheetNames[0]];
        const json = XLSX.utils.sheet_to_json(sheet, { header: 1 });

        parsedStudents = [];
        const tbody = document.getElementById("previewBody");
        tbody.innerHTML = "";

        // تخطي صف العناوين الأول
        for (let i = 1; i < json.length; i++) {
          if (json[i][0]) {
            const student = {
              name: json[i][0] || "-",
              id: json[i][1] || "-",
              group: json[i][2] || "-",
              section: json[i][3] || "-"
            };
            parsedStudents.push(student);
            tbody.innerHTML += `
              <tr>
                <td>${i}</td>
                <td><strong>${student.name}</strong></td>
                <td>${student.id}</td>
                <td>${student.group}</td>
                <td>${student.section}</td>
              </tr>
            `;
          }
        }

        document.getElementById("totalLoaded").innerText = parsedStudents.length;
        document.getElementById("previewCard").style.display = "block";
      };
      reader.readAsArrayBuffer(file);
    }

    function saveImportedStudents() {
      localStorage.setItem("roster_students", JSON.stringify(parsedStudents));
      alert("تم حفظ كشف الطلاب بنجاح!");
      window.location.href = "index.html";
    }
  </script>
</body>
</html>
