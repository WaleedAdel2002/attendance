<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة المحاضر | تسجيل الحضور المقفل</title>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; background: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
    .card { background: #fff; border-radius: 16px; box-shadow: 0 4px 25px rgba(0,0,0,0.06); padding: 35px 30px; width: 100%; max-width: 440px; text-align: center; }
    h2 { margin: 0 0 15px; color: #0f172a; }
    input { width: 100%; padding: 12px; margin-bottom: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 15px; box-sizing: border-box; }
    .btn { width: 100%; padding: 13px; background: #0284c7; color: #fff; border: none; border-radius: 8px; font-weight: bold; font-size: 15px; cursor: pointer; }
    .btn:hover { background: #0369a1; }
    #qrWrap { display: flex; justify-content: center; margin: 20px 0; min-height: 220px; }
    .badge { display: inline-block; padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: bold; background: #fef3c7; color: #92400e; }
    .info { font-size: 13px; color: #64748b; margin-top: 15px; }
  </style>
</head>
<body>
  <div class="card">
    <h2>منظومة الحضور المؤمنة</h2>
    <div id="setup">
      <input type="text" id="courseName" placeholder="اسم المقرر أو المحاضرة">
      <input type="number" id="radiusInput" value="30" placeholder="نطاق القاعة المسموح بالمتر">
      <button class="btn" onclick="startLecture()">تثبيت إحداثيات القاعة وبدء العرض</button>
    </div>
    <div id="displayArea" style="display:none;">
      <div id="qrWrap"></div>
      <div class="badge">صلاحية الرمز: <span id="secTimer">10</span> ثوانٍ</div>
      <p class="info" id="infoText"></p>
    </div>
  </div>

  <script>
    let lat = 0, lng = 0, radius = 30, qr = null, timer = 10;

    function startLecture() {
      if (!navigator.geolocation) return alert("المتصفح لا يدعم تحديد الموقع");
      const radVal = document.getElementById("radiusInput").value;
      if (radVal) radius = parseFloat(radVal);

      navigator.geolocation.getCurrentPosition(pos => {
        lat = pos.coords.latitude;
        lng = pos.coords.longitude;
        document.getElementById("setup").style.display = "none";
        document.getElementById("displayArea").style.display = "block";
        document.getElementById("infoText").innerText = `نطاق القاعة: ${radius} متر | حماية منع مشاركة الروابط نشطة`;

        qr = new QRCode(document.getElementById("qrWrap"), { width: 220, height: 220 });
        updateQR();
        setInterval(updateQR, 10000);
        setInterval(() => {
          timer--;
          if (timer >= 0) document.getElementById("secTimer").innerText = timer;
        }, 1000);
      }, () => alert("يرجى تفعيل الـ GPS والسماح بالإذن للمتصفح"), { enableHighAccuracy: true });
    }

    function updateQR() {
      timer = 10;
      const token = Math.random().toString(36).substring(2, 8);
      const ts = Date.now(); // طابع الوقت الحالي بالمللي ثانية
      const course = encodeURIComponent(document.getElementById("courseName").value.trim() || "عام");

      const basePath = window.location.pathname.substring(0, window.location.pathname.lastIndexOf('/') + 1);
      // الرابط يحمل وقت توليده الدقيق ts
      const url = `${window.location.origin}${basePath}student.html?k=${token}&ts=${ts}&lat=${lat}&lng=${lng}&r=${radius}&c=${course}`;

      qr.clear();
      qr.makeCode(url);
    }
  </script>
</body>
</html>
