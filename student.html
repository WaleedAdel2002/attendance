<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل حضور الطالب</title>
  <style>
    :root { --primary: #0284c7; --btn-ok: #16a34a; --bg: #f8fafc; --text: #0f172a; --border: #cbd5e1; }
    body { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px 15px; box-sizing: border-box; }
    .box { background: #fff; padding: 30px 24px; border-radius: 16px; width: 100%; max-width: 420px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; }
    h3 { margin: 0 0 8px; font-size: 20px; text-align: center; color: #1e293b; }
    .badge { display: block; margin: 0 auto 15px; width: fit-content; padding: 4px 14px; background: #e0f2fe; color: #0369a1; border-radius: 20px; font-size: 13px; font-weight: bold; }
    .form-group { margin-bottom: 14px; text-align: right; }
    label { display: block; margin-bottom: 6px; font-size: 13px; font-weight: 600; color: #334155; }
    input, select { width: 100%; padding: 11px 13px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; box-sizing: border-box; outline: none; background-color: #fff; font-family: inherit; }
    input:focus, select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15); }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    button { width: 100%; padding: 13px; background: var(--btn-ok); color: #fff; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; transition: background 0.2s ease; }
    button:disabled { background: #94a3b8; cursor: not-allowed; }
    #status { margin-top: 16px; padding: 12px; border-radius: 8px; font-size: 13px; display: none; text-align: center; line-height: 1.5; }
    .danger { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
    .success { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
    .info { background: #e0f2fe; color: #075985; border: 1px solid #bae6fd; }
  </style>
</head>
<body>

  <div class="box">
    <div id="courseNameBadge" class="badge" style="display:none;"></div>
    <h3>تسجيل حضور المحاضرة</h3>
    <p style="text-align:center; font-size:13px; color:#64748b; margin-top:0; margin-bottom:18px;">
      تحقق من بياناتك لتأكيد تواجدك داخل القاعة
    </p>

    <div class="form-group">
      <label for="fullName">الاسم رباعي أو الكود الجامعي</label>
      <input type="text" id="fullName" list="studentNamesList" placeholder="أدخل اسمك رباعياً كما بالكشف" oninput="handleAutoLookup(this.value)">
      <datalist id="studentNamesList"></datalist>
    </div>

    <div class="form-group">
      <label for="gradeLevel">الفرقة الدراسية</label>
      <select id="gradeLevel">
        <option value="">-- اختر الفرقة --</option>
        <option value="الفرقة الأولى">الفرقة الأولى</option>
        <option value="الفرقة الثانية">الفرقة الثانية</option>
        <option value="الفرقة الثالثة">الفرقة الثالثة</option>
        <option value="الفرقة الرابعة">الفرقة الرابعة</option>
      </select>
    </div>

    <div class="grid-2">
      <div class="form-group">
        <label for="groupNo">رقم المجموعة</label>
        <input type="text" id="groupNo" placeholder="مثال: 1">
      </div>
      <div class="form-group">
        <label for="sectionNo">رقم السكشن</label>
        <input type="text" id="sectionNo" placeholder="مثال: 2">
      </div>
    </div>

    <button id="subBtn" onclick="submitAttendance()">تأكيد الحضور</button>
    <div id="status"></div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxSOBgR0KLCgDLBZYsiFcmG1EXMIMJE-ZEtOidFNTSS3FIZRvlGpIycZd_leld5MU-k/exec";

    const params = new URLSearchParams(window.location.search);
    const targetLat = parseFloat(params.get("lat"));
    const targetLng = parseFloat(params.get("lng"));
    const allowedRadius = parseFloat(params.get("r")) || 30;
    const courseTitle = decodeURIComponent(params.get("c") || "");
    const lecturerEmail = decodeURIComponent(params.get("u") || "");
    const generatedTime = parseInt(params.get("ts"), 10);

    // تجميع الكشوفات المحلية المتاحة
    let rosterExcel = JSON.parse(localStorage.getItem("roster_students") || "[]");
    let studentCache = JSON.parse(localStorage.getItem("student_roster_cache") || "[]");
    let allStudents = [...rosterExcel, ...studentCache];

    window.onload = function() {
      // 1. التعبئة التلقائية المباشرة إذا سبق التسجيل على هذا الجهاز
      const savedName = localStorage.getItem("saved_student_name");
      const savedGrade = localStorage.getItem("saved_student_grade");
      const savedGroup = localStorage.getItem("saved_student_group");
      const savedSection = localStorage.getItem("saved_student_section");

      if (savedName) document.getElementById("fullName").value = savedName;
      if (savedGrade) document.getElementById("gradeLevel").value = savedGrade;
      if (savedGroup) document.getElementById("groupNo").value = savedGroup;
      if (savedSection) document.getElementById("sectionNo").value = savedSection;

      // 2. تعبئة قائمة الاقتراحات في datalist
      populateDatalist();
    };

    function populateDatalist() {
      const dl = document.getElementById("studentNamesList");
      dl.innerHTML = "";
      const seen = new Set();

      // الاسم المحفوظ مسبقاً يظهر أولاً
      const savedName = localStorage.getItem("saved_student_name");
      if (savedName) {
        seen.add(savedName.trim());
        const opt = document.createElement("option");
        opt.value = savedName;
        dl.appendChild(opt);
      }

      // إضافة أسماء الكشف المستورد
      allStudents.forEach(st => {
        const nameStr = (st.name || "").trim();
        if (nameStr && !seen.has(nameStr)) {
          seen.add(nameStr);
          const opt = document.createElement("option");
          opt.value = nameStr;
          if (st.id) opt.label = `كود: ${st.id}`;
          dl.appendChild(opt);
        }
      });
    }

    // إكمال تلقائي للحقول بمجرد اختيار الاسم أو التطابق
    function handleAutoLookup(val) {
      if (!val) return;
      const cleanVal = val.trim().toLowerCase();
      
      const match = allStudents.find(s => 
        (s.name && s.name.trim().toLowerCase() === cleanVal) || 
        (s.id && s.id.toString().trim() === cleanVal)
      );

      if (match) {
        document.getElementById("fullName").value = match.name;
        if (match.grade) document.getElementById("gradeLevel").value = match.grade;
        if (match.group) document.getElementById("groupNo").value = match.group;
        if (match.section) document.getElementById("sectionNo").value = match.section;
      }
    }

    function showMessage(msg, type) {
      const el = document.getElementById("status");
      el.className = type;
      el.innerText = msg;
      el.style.display = "block";
    }

    if (courseTitle && courseTitle !== "undefined" && courseTitle !== "عام") {
      const badge = document.getElementById("courseNameBadge");
      badge.innerText = courseTitle;
      badge.style.display = "block";
    }

    // فحص صلاحية الرمز (مهلة 90 ثانية كحد أقصى للمسح من الشاشة)
    const now = Date.now();
    const timeDiff = now - generatedTime;
    if (!generatedTime || timeDiff > 90000 || timeDiff < -30000) {
      setTimeout(() => {
        showMessage("انتهت صلاحية هذا الرمز. يرجى مسح الـ QR المعروض حالياً على الشاشة مباشرة.", "danger");
        document.getElementById("subBtn").disabled = true;
      }, 200);
    }

    function getDeviceIdentifier() {
      let dId = localStorage.getItem("student_device_uuid");
      if (!dId) {
        dId = "DEV-" + Math.random().toString(36).substring(2, 10) + "-" + Date.now().toString(36);
        localStorage.setItem("student_device_uuid", dId);
      }
      return dId;
    }

    function getDistance(lat1, lon1, lat2, lon2) {
      const R = 6371e3;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat / 2) ** 2 + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon / 2) ** 2;
      return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
    }

    function submitAttendance() {
      const fullName = document.getElementById("fullName").value.trim();
      const grade = document.getElementById("gradeLevel").value.trim();
      const group = document.getElementById("groupNo").value.trim();
      const section = document.getElementById("sectionNo").value.trim();
      const btn = document.getElementById("subBtn");

      if (!fullName || fullName.split(" ").length < 3) return showMessage("يرجى كتابة الاسم ثلاثياً أو رباعياً", "danger");
      if (!grade) return showMessage("يرجى اختيار الفرقة الدراسية", "danger");
      if (!group || !section) return showMessage("يرجى كتابة رقم المجموعة ورقم السكشن", "danger");

      const sessionKey = "reg_" + lecturerEmail + "_" + (courseTitle || "lecture");
      if (localStorage.getItem(sessionKey)) {
        return showMessage("تم تسجيل الحضور مسبقاً من هذا الجهاز لهذه المحاضرة!", "danger");
      }

      btn.disabled = true;
      showMessage("جاري التحقق من إحداثيات تواجدك داخل القاعة...", "info");

      navigator.geolocation.getCurrentPosition(
        (pos) => {
          const uLat = pos.coords.latitude;
          const uLng = pos.coords.longitude;
          const dist = getDistance(targetLat, targetLng, uLat, uLng);

          if (dist > allowedRadius) {
            btn.disabled = false;
            return showMessage(`أنت خارج نطاق القاعة المسموح (${Math.round(dist)} متر)`, "danger");
          }

          showMessage("جاري توثيق البيانات ورفع الحضور إلى السحابة...", "info");

          const deviceId = getDeviceIdentifier();

          fetch(SCRIPT_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              lecturerEmail: lecturerEmail,
              studentName: fullName,
              gradeLevel: grade,
              groupNo: group,
              sectionNo: section,
              deviceId: deviceId,
              courseTitle: courseTitle,
              coords: `${uLat.toFixed(6)}, ${uLng.toFixed(6)}`,
              distance: dist
            })
          })
          .then(() => {
            // حفظ بيانات الطالب في هاتفه لتعبئتها تلقائياً دائماً
            localStorage.setItem("saved_student_name", fullName);
            localStorage.setItem("saved_student_grade", grade);
            localStorage.setItem("saved_student_group", group);
            localStorage.setItem("saved_student_section", section);
            localStorage.setItem(sessionKey, fullName);

            showMessage("تم تسجيل حضورك بنجاح وتوثيق بياناتك في كشف المحاضرة!", "success");
            document.getElementById("fullName").disabled = true;
            document.getElementById("gradeLevel").disabled = true;
            document.getElementById("groupNo").disabled = true;
            document.getElementById("sectionNo").disabled = true;
          })
          .catch(() => {
            btn.disabled = false;
            showMessage("تعذر الاتصال، تأكد من اتصال الإنترنت وحاول ثانية", "danger");
          });
        },
        () => {
          btn.disabled = false;
          showMessage("يجب تفعيل الـ GPS وإعطاء الإذن للمتصفح", "danger");
        },
        { enableHighAccuracy: true, timeout: 10000 }
      );
    }
  </script>
</body>
</html>
